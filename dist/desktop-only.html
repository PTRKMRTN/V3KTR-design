/* V3KTR design tokens · v0.41.77
   Source of truth: PTRKMRTN/V3KTR-design. Do not edit a copy inside an app —
   change it here, tag a release, bump the app's pinned version.
   Extracted from PROCESSOR index.html :root (origin/main 4f170b9, 2026-09-29). */
:root {
  /* Ground — neutral greys. Panels are a lighter FILL, never a frame. */
  --bg-0:#212121; --bg-1:#212121; --bg-2:#2b2b2b; --bg-3:#3a3a3a; --bg-4:#444444;
  --line:#171717;

  /* Text — neutral greys, to match the neutral ground. Settled 2026-09-29: no cool/blue tint. */
  --tx-0:#f4f4f4; --tx-1:#cfcfcf; --tx-2:#8a8a8a;

  /* Signal — one aqua for every app; no per-app accents. Hover settled 2026-09-29: #3dffc2. */
  --accent:#00e5a0; --accent-dim:#0a8f66; --accent-glow:rgba(0,229,160,0.15);
  --hover:#3dffc2; --on-accent:#1c1c1c; --ctrl-line:rgba(255,255,255,.20);
  /* Control outlines (Patrick 2026-09-30). --ctrl-line above is 1.9:1 and fails WCAG 1.4.11 as a control boundary;
     new outlines use --ctrl-edge (3.5:1 ground, 3.1 panel). --stroke is the standard outline width. */
  --ctrl-edge:#757575; --stroke:2px;

  /* Status */
  --danger:#ff5e7e; --danger-dim:#7a2d3c;   /* = the status red (Patrick 2026-09-30); was #ff5b5b / #7a2a2a */
  /* Status: ready / caution / blocked. LOCKED 2026-09-30 (Patrick). --danger above is the same red as blocked.
     Chosen to stay clear of the app colours and FX-group colours: the green sits between PROCESSOR's aqua and
     depth's lime (ΔE 45 / 40), the yellow is away from KOMPOSITOR's mandarin (ΔE 55+), the red is ΔE 35 from
     mandarin (the old --danger was 17). Each passes 4.5:1 as small text on the ground and panels, and --on-status on it
     as a fill (10.0 / 10.3 / 5.8). Never colour alone: a status always carries an icon and a word. */
  --status-ready:#00e540; --status-caution:#f9c200; --status-blocked:#ff5e7e; --on-status:#1c1c1c;
  /* The one danger-fill button (.vk-btn--danger, app/app.css) needs a red-tinted near-black, not the generic
     --on-status, for contrast on --danger's pink-red; moved here from app/app.css (v0.41.12, design-audit
     follow-up) so PROCESSOR — which pulls tokens.css but not app.css — can reach it too. */
  --app-danger-ink:#1a0606;

  /* FX-group identity colours (independent of the signal colour) */
  /* LOCKED 2026-09-30 (Patrick). Every group colour passes 4.5:1 as small text on panels (#2b2b2b), so group
     labels and group chips can use it. Depth is lime: all three apps use depth, so it no longer reuses
     PROCESSOR's aqua. Six were lifted in lightness only (same hue and intensity) to pass. */
  --depth:#b1e800; --adjust:#9aa0a6; --rust:#cd7f6e;
  --type-amber:#b58d4c; --type-rust:#cd7f6e; --type-rose:#c67f93;
  --type-sage:#7b9c76; --type-teal:#6b9ca1; --type-slate:#8c94a3;
  --type-violet:#a386cb;
  /* --type-fuchsia (v0.35.8, Patrick 2026-10-08): DIMENSOR's Effectors rail group, which had been borrowing
     Instance's rose provisionally. Chosen to sit next to rose the way rust already does (ΔE 22 from rose, close
     to rust's 21.3): related, not a repaint. Passes 4.5:1 on the ground and on panels (5.71 / 5.02). */
  --type-fuchsia:#d47dba;

  /* Type */
  --sans:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --fs-body:13px; --fs-ctrl:11px; --fs-row:11.5px;
  --head-weight:700; --head-track:.16em;

  /* Shape + spacing */
  --radius:0;   /* square corners everywhere (Patrick 2026-09-30). PROCESSOR declared 2px but never used it. */
  --pad:22px; --row-h:26px;   /* PROCESSOR v0.571.0 spacing pass (was 12 / 28) */
  /* Panel sections (v0.32.0, Patrick 2026-10-03): space alone groups them, no divider lines ("when there are lots it
     creates noise"). A section is padded --sec-pad at the sides and the panel ends, --sec-gap (1.5 × --pad, 33px) sits
     between one section's last control and the next title, and a title sits --sec-head-gap above its first control. */
  --sec-pad:var(--pad); --sec-gap:calc(var(--pad) * 1.5); --sec-head-gap:14px; --sub-head-gap:22px;
  /* Workspace frames (v0.36.0, Patrick 2026-10-08): a scroll area sits --pad in from every edge of its frame, so content
     never scrolls into a separator; it fades out over --scroll-fade at an edge that has more to scroll. A frame separator
     sits on the frame edge, inset --pad along its length; --grip is the optional resize square on a vertical one. */
  --scroll-fade:var(--pad); --grip:18px;
  /* Floating viewport toolbars (Patrick 2026-10-01): the bottom bar sits one toolbar-height higher than before (was 14px)
     and each bar stacked above it (motion timeline, pinned toast) adds one --vp-bar-step. Same in every app. */
  --vp-bar-step:36px; --vp-bar-bottom:50px;
  /* Viewport handles (v0.41.58, Patrick 2026-10-25, DIMENSOR curves + FX handles; docs/VIEWPORT-HANDLES.md): screen-space sizes, never scaled with the camera.
     A point 10px, hot (hover / selected / dragging) 12px, a tangent 7px, hit area 24px (32px on touch), the curve line 2px, aux lines 1px. */
  --hdl-size:10px; --hdl-hot:12px; --hdl-tan:7px; --hdl-hit:24px; --hdl-hit-touch:32px; --hdl-curve:2px; --hdl-aux:1px;
  --hdl-halo:drop-shadow(0 0 1px rgba(0,0,0,.85));
  /* Top bar (v0.18.0, Patrick 2026-10-02: logo and menus the same in every app). The logo is sized to the menu text:
     every app logo is 154 units high with 65.86-unit capitals (baseline 87.01); the menu (Manrope 12.5px) has 9px
     capitals with the baseline 22.5px below the bar's top. So height = 9 x 154 / 65.86 = 21.05px and
     top = 22.5 - 21.05 x 87.01 / 154 = 10.61px. The width comes from each logo's viewBox (themes.css). */
  --bar-h:36px; --brand-logo-h:21.05px; --brand-logo-top:10.61px;
  /* The brand slot is ONE width in every app (Patrick 2026-10-02: "start file in the same spot across the board", so
     nothing shudders when cycling between the apps): the widest app logo (KOMPOSITOR, 128.35px) + 14px. */
  --brand-slot:142.35px;
  /* Flat states (v0.21.0, Patrick 2026-10-02): app-colour tints over the element instead of outlines.
     Measured in all three app colours: tx-0/tx-1 text stays above 5.7:1 on every one. */
  --tint-hover:12%;    /* a hovered row */
  --tint-sel:42%;      /* a selected row (v0.22.0, Patrick: option C; was 26%). Everything on it goes --tx-0: white measures 4.86:1 at worst (PROCESSOR), grey fails */
  --tint-ctrl:28%;     /* a hovered toggle */
  --tint-field:18%;    /* a field being typed in */
  --thumb-wash:.32;    /* a hovered thumbnail */
  --focus-ring:2px solid var(--accent); --focus-offset:2px;
}

/* V3KTR app themes · LOCKED (Patrick 2026-09-30)
   One colour per app. A theme sets ONLY the signal family; greys, fonts and the FX-group colours are core.
   Included in dist/app.css and dist/site.css. An app sets data-app="…" on its root; the site sets it on an
   app's section, card or call-to-action.

   Every colour passes WCAG 4.5:1 as small text on the ground (#212121), wells (#262626) and panels (#2b2b2b),
   and dark ink (#1c1c1c) on it passes 4.5:1 as a button fill:
     PROCESSOR   #00e5a0  ground 9.75 · panel 8.57 · ink-on 10.32
     KOMPOSITOR  #ff6a43  ground 5.67 · panel 4.99 · ink-on 6.00   (ΔE 35 from --danger since v0.10.0, was 17; still pair destructive actions with an icon or wording)
     DIMENSOR    #bb6fff  ground 5.24 · panel 4.61 · ink-on 5.54   (was #9d64ff, 4.37 / 3.84: hue nudged warmer to keep intensity, OKLCH C 0.210 vs 0.220)
   --accent-ink is the shade for LIGHT grounds (site, socials, print): each passes 4.5:1 on #f4f4f4 and #fff. */
:root {
  --processor:#00e5a0;  --processor-hover:#3dffc2;  --processor-dim:#0a8f66;  --processor-ink:#008058;
  --kompositor:#ff6a43; --kompositor-hover:#ff8f72; --kompositor-dim:#9d4b35; --kompositor-ink:#cf3700;
  --dimensor:#bb6fff;   --dimensor-hover:#ca96ff;   --dimensor-dim:#764c9b;   --dimensor-ink:#a70dff;

  --kompositor-2:#f8b787; --kompositor-2-hover:#fac9a5; --kompositor-2-dim:#82654f;
  --dimensor-2:#ecb0eb;   --dimensor-2-hover:#f1c4f0;   --dimensor-2-dim:#7c617c;

/* The focus ring is declared in core as `2px solid var(--accent)`; a custom property resolves var() where it is

.vk-btn{font-family:var(--mono);text-transform:uppercase;padding:8px 14px;background:var(--bg-3);

.vk-btn--primary,
